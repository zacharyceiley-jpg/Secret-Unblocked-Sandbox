<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Character Game</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            #18243b 0%,
            #263d5d 60%,
            #1d5130 60%,
            #1d5130 100%
        );
}

/* =========================
   GROUND
========================= */

#ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 40%;

    background:
        repeating-linear-gradient(
            45deg,
            #205a34 0px,
            #205a34 20px,
            #1d5130 20px,
            #1d5130 40px
        );
}

/* =========================
   PLAYER
========================= */

#player {
    position: absolute;

    left: 50%;
    bottom: 40%;

    width: 70px;
    height: 100px;

    transform: translateX(-50%);

    background: white;
    border: 4px solid black;

    object-fit: contain;
    image-rendering: pixelated;

    z-index: 10;
}

#player.morphed {
    background: transparent;
    border: none;
}

/* =========================
   CHARACTER MENU
========================= */

#characterMenu {
    position: absolute;

    top: 20px;
    left: 20px;

    width: min(700px, calc(100vw - 40px));

    padding: 15px;

    background: rgba(0, 0, 0, .72);

    border: 2px solid rgba(255, 255, 255, .2);

    border-radius: 15px;

    backdrop-filter: blur(8px);

    z-index: 50;
}

#menuTitle {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
}

/* =========================
   SEARCH
========================= */

#characterSearch {
    width: 100%;

    padding: 11px 14px;

    margin-bottom: 12px;

    border: 2px solid rgba(255, 255, 255, .2);

    border-radius: 10px;

    background: rgba(255, 255, 255, .08);

    color: white;

    outline: none;

    font-size: 15px;
}

#characterSearch::placeholder {
    color: rgba(255, 255, 255, .55);
}

#characterSearch:focus {
    border-color: #5ee7ff;

    background: rgba(255, 255, 255, .12);
}

/* =========================
   CHARACTERS
========================= */

#characters {
    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    max-height: 170px;

    overflow-y: auto;
}

.character {
    width: 90px;
    height: 110px;

    border: 2px solid rgba(255, 255, 255, .25);

    border-radius: 12px;

    background: rgba(255, 255, 255, .08);

    color: white;

    cursor: pointer;

    padding: 7px;

    text-align: center;

    transition: .15s;
}

.character:hover {
    transform: translateY(-3px);

    background: rgba(255, 255, 255, .18);
}

.character.selected {
    border-color: #5ee7ff;

    box-shadow:
        0 0 15px rgba(94, 231, 255, .5);
}

.character img {
    width: 65px;
    height: 65px;

    object-fit: contain;

    image-rendering: pixelated;

    display: block;

    margin: auto;
}

.characterName {
    margin-top: 5px;

    font-size: 13px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

/* =========================
   STATUS
========================= */

#status {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    padding: 20px 30px;

    background: rgba(0, 0, 0, .8);

    border-radius: 12px;

    z-index: 100;

    text-align: center;
}

#status.hidden {
    display: none;
}

/* =========================
   EQUIPPED CHARACTER
========================= */

#equipped {
    position: absolute;

    right: 20px;
    top: 20px;

    padding: 10px 15px;

    border-radius: 10px;

    background: rgba(0, 0, 0, .65);

    z-index: 30;
}

/* =========================
   ANIMATION BAR
========================= */

#animationBar {
    position: absolute;

    bottom: 20px;
    left: 20px;

    display: flex;

    flex-direction: column;

    gap: 7px;

    z-index: 30;
}

.animationButton {
    min-width: 130px;

    padding: 10px 14px;

    border: 2px solid rgba(255, 255, 255, .2);

    border-radius: 9px;

    background: rgba(0, 0, 0, .72);

    color: white;

    cursor: pointer;

    text-align: left;
}

.animationButton:hover {
    background: rgba(255, 255, 255, .2);
}

/* =========================
   CONTROLS
========================= */

#controls {
    position: absolute;

    right: 20px;
    bottom: 20px;

    padding: 12px 16px;

    border-radius: 10px;

    background: rgba(0, 0, 0, .65);

    font-size: 13px;

    z-index: 30;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #characterMenu {
        width: calc(100vw - 20px);

        left: 10px;
        top: 10px;
    }

    #characterMenu {
        padding: 10px;
    }

    #controls {
        display: none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="ground"></div>

    <!-- PLAYER -->
    <img
        id="player"
        alt="Player"
    >

    <!-- CHARACTER MENU -->
    <div id="characterMenu">

        <div id="menuTitle">
            Characters
        </div>

        <input
            id="characterSearch"
            type="text"
            placeholder="Search characters..."
            autocomplete="off"
        >

        <div id="characters"></div>

    </div>

    <!-- EQUIPPED -->
    <div id="equipped">
        Character: None
    </div>

    <!-- ANIMATIONS -->
    <div id="animationBar"></div>

    <!-- CONTROLS -->
    <div id="controls">
        WASD / Arrow Keys — Move
    </div>

    <!-- LOADING -->
    <div id="status">
        Searching repository...
    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const GAME_CONFIG = {

    /*
     * Leave these blank when using GitHub Pages.
     *
     * Example:
     *
     * https://zac123.github.io/MyGame/
     *
     * will automatically detect:
     *
     * owner = zac123
     * repo  = MyGame
     */

    owner: "",
    repo: "",

    branch: "main"

};


/* =========================================================
   VARIABLES
========================================================= */

let characters = [];

let equippedCharacter = null;

let playerX =
    window.innerWidth / 2;

const player =
    document.getElementById("player");

const characterContainer =
    document.getElementById("characters");

const animationBar =
    document.getElementById("animationBar");

const statusBox =
    document.getElementById("status");

const equippedLabel =
    document.getElementById("equipped");

const characterSearch =
    document.getElementById("characterSearch");

const keys = {};


/* =========================================================
   DETECT REPOSITORY
========================================================= */

function detectRepository() {

    if (
        GAME_CONFIG.owner &&
        GAME_CONFIG.repo
    ) {

        return {

            owner: GAME_CONFIG.owner,

            repo: GAME_CONFIG.repo

        };

    }

    const hostname =
        window.location.hostname;

    /*
     * GitHub Pages:
     *
     * username.github.io/repository
     */

    if (
        hostname.endsWith(".github.io")
    ) {

        const owner =
            hostname.split(".")[0];

        const parts =
            window.location.pathname
                .split("/")
                .filter(Boolean);

        if (parts.length > 0) {

            return {

                owner: owner,

                repo: parts[0]

            };

        }

        return {

            owner: owner,

            repo: owner + ".github.io"

        };

    }

    return null;
}


/* =========================================================
   GITHUB API
========================================================= */

async function githubAPI(path) {

    const response =
        await fetch(
            "https://api.github.com/repos/" +
            path
        );

    if (!response.ok) {

        throw new Error(
            "GitHub API error: " +
            response.status
        );

    }

    return response.json();
}


/* =========================================================
   LOAD CHARACTERS
========================================================= */

async function loadCharacters() {

    const repository =
        detectRepository();

    if (!repository) {

        showError(
            "Could not detect the GitHub repository.<br><br>" +

            "Set GAME_CONFIG.owner and GAME_CONFIG.repo."
        );

        return;
    }

    try {

        const root =
            await githubAPI(

                `${repository.owner}/${repository.repo}/contents?ref=${GAME_CONFIG.branch}`

            );

        /*
         * Every folder is potentially
         * a character.
         */

        const folders =
            root.filter(
                item =>
                    item.type === "dir"
            );


        for (const folder of folders) {

            try {

                const files =
                    await githubAPI(

                        `${repository.owner}/${repository.repo}/contents/${encodeURIComponent(folder.name)}?ref=${GAME_CONFIG.branch}`

                    );


                /*
                 * Find PNG files.
                 */

                const pngs =
                    files.filter(
                        file =>
                            file.type === "file" &&
                            file.name
                                .toLowerCase()
                                .endsWith(".png")
                    );


                /*
                 * Required files.
                 */

                const icon =
                    pngs.find(
                        file =>
                            file.name
                                .toLowerCase() ===
                            "icon.png"
                    );

                const base =
                    pngs.find(
                        file =>
                            file.name
                                .toLowerCase() ===
                            "base.png"
                    );


                /*
                 * Folder isn't a character
                 * unless both files exist.
                 */

                if (!icon || !base) {

                    continue;

                }


                /*
                 * Everything else is
                 * considered an animation.
                 */

                const animations =
                    pngs.filter(
                        file => {

                            const name =
                                file.name
                                    .toLowerCase();

                            return (
                                name !== "icon.png" &&
                                name !== "base.png"
                            );

                        }
                    );


                characters.push({

                    name: folder.name,

                    folder: folder.name,

                    icon: icon.download_url,

                    base: base.download_url,

                    animations:
                        animations.map(
                            file => ({

                                name:
                                    file.name
                                        .replace(
                                            /\.png$/i,
                                            ""
                                        ),

                                url:
                                    file.download_url

                            })
                        )

                });

            } catch (error) {

                console.warn(
                    "Couldn't load:",
                    folder.name,
                    error
                );

            }

        }


        hideStatus();

        renderCharacters();


        if (
            characters.length === 0
        ) {

            showError(

                "No characters found.<br><br>" +

                "A character folder needs:<br><br>" +

                "<b>icon.png</b><br>" +

                "<b>base.png</b>"

            );

        }

    } catch (error) {

        console.error(error);

        showError(

            "Couldn't access the GitHub repository.<br><br>" +

            error.message

        );

    }

}


/* =========================================================
   RENDER CHARACTER BUTTONS
========================================================= */

function renderCharacters() {

    characterContainer.innerHTML = "";

    characters.forEach(
        (character, index) => {

            const button =
                document.createElement("button");

            button.className =
                "character";


            button.innerHTML = `

                <img
                    src="${character.icon}"
                    alt="${escapeHTML(character.name)}"
                >

                <div class="characterName">

                    ${escapeHTML(character.name)}

                </div>

            `;


            button.onclick =
                () => {

                    equipCharacter(index);

                };


            characterContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

characterSearch.addEventListener(
    "input",
    () => {

        const search =
            characterSearch.value
                .trim()
                .toLowerCase();


        document
            .querySelectorAll(".character")
            .forEach(
                (button, index) => {

                    const character =
                        characters[index];


                    const matches =
                        character.name
                            .toLowerCase()
                            .includes(search);


                    button.style.display =
                        matches
                            ? ""
                            : "none";

                }
            );

    }
);


/* =========================================================
   EQUIP CHARACTER
========================================================= */

function equipCharacter(index) {

    equippedCharacter =
        characters[index];


    /*
     * Change player into base.png
     */

    player.src =
        equippedCharacter.base;


    player.classList.add(
        "morphed"
    );


    equippedLabel.textContent =
        "Character: " +
        equippedCharacter.name;


    renderAnimations();


    /*
     * Highlight selected character.
     */

    document
        .querySelectorAll(".character")
        .forEach(
            (element, i) => {

                element.classList.toggle(
                    "selected",
                    i === index
                );

            }
        );

}


/* =========================================================
   ANIMATION BUTTONS
========================================================= */

function renderAnimations() {

    animationBar.innerHTML = "";


    if (!equippedCharacter) {

        return;

    }


    if (
        equippedCharacter.animations.length === 0
    ) {

        const text =
            document.createElement("div");

        text.textContent =
            "No animations";

        animationBar.appendChild(
            text
        );

        return;

    }


    equippedCharacter.animations.forEach(
        animation => {

            const button =
                document.createElement("button");


            button.className =
                "animationButton";


            button.textContent =
                animation.name;


            button.onclick =
                () => {

                    playAnimation(
                        animation
                    );

                };


            animationBar.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   PLAY ANIMATION
========================================================= */

function playAnimation(animation) {

    if (!equippedCharacter) {

        return;

    }


    const baseImage =
        equippedCharacter.base;


    /*
     * Show animation PNG.
     */

    player.src =
        animation.url;


    /*
     * Return to base after
     * a short period.
     */

    setTimeout(
        () => {

            if (
                equippedCharacter &&
                player.src === animation.url
            ) {

                player.src =
                    baseImage;

            }

        },
        700
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(
                event.key.toLowerCase()
            )
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    const speed = 5;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        playerX -= speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        playerX += speed;

    }


    /*
     * Keep player on screen.
     */

    playerX =
        Math.max(
            35,
            Math.min(
                window.innerWidth - 35,
                playerX
            )
        );


    player.style.left =
        playerX + "px";


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   UTILITIES
========================================================= */

function hideStatus() {

    statusBox.classList.add(
        "hidden"
    );

}


function showError(message) {

    statusBox.innerHTML =
        message;

    statusBox.classList.remove(
        "hidden"
    );

}


function escapeHTML(text) {

    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

loadCharacters();

gameLoop();

</script>

</body>
</html>
